server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 1024m;        # เดโมไฟล์ละหลายร้อย MB (backend มีเพดาน MAX_DEMO_MB ของตัวเองอีกชั้น)
    proxy_request_buffering off;       # ส่งไฟล์ผ่านไปเลย ไม่ต้องเก็บทั้งก้อนใน nginx ก่อน
    proxy_read_timeout 600s;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api http://api:8000;

    location /api/    { proxy_pass $api; proxy_set_header Host $http_host; proxy_set_header X-Forwarded-Proto $scheme; }
    location /auth/   { proxy_pass $api; proxy_set_header Host $http_host; proxy_set_header X-Forwarded-Proto $scheme; }
    location /assets/ { proxy_pass $api; }   # ภาพเรดาร์ของ backend — ไฟล์ของ React อยู่ที่ /_app/ (vite.config.ts)

    # Vite filenames contain a content hash and can be cached permanently.
    # A missing old hash must be a real 404, not the SPA HTML fallback.
    location /_app/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Never cache the application shell: each deployment may reference new
    # hashed JS/CSS files.
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    location / {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        try_files $uri /index.html;
    }
}
